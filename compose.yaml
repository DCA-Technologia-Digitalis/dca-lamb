services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./dv_odonto.db
        target: /app/dv_odonto.db
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./static/uploads
        target: /app/static/uploads
        bind:
          create_host_path: false
      - type: bind
        source: ./uploads
        target: /app/uploads
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    stop_grace_period: 30s
