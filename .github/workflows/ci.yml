name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest

      - name: Executar testes
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest tests/ -v --tb=short

  docker:
    name: Build e smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dv-saude:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Iniciar container
        run: |
          docker run -d --rm --name dv-saude-ci -p 8000:8000 \
            -e SECRET_KEY=ci-only-secret-key \
            dv-saude:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then
              echo "OK"; exit 0
            fi
            sleep 2
          done
          docker logs dv-saude-ci; exit 1

      - name: Logs do container
        if: always()
        run: docker logs dv-saude-ci || true

      - name: Parar container
        if: always()
        run: docker stop dv-saude-ci || true

  publish:
    name: Publicar imagem
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
